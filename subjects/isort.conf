# isort 7.0.0 - https://github.com/PyCQA/isort
#
# Needs Python >= 3.10 (isort 7.0.0's package metadata). Setup: subjects/README.md.
# Verified on this machine with Python 3.12: 527 passed, 1 skipped in ~3 s.
# Note: isort 9.0.1 is the newest release (2026-08-27); 7.0.0 is pinned on request.
#
# LLMORPHEUS_PROJECT is relative to this file. LLMORPHEUS_SRC, LLMORPHEUS_EXCLUDE
# and LLMORPHEUS_TEST_COMMAND are relative to the project directory.

LLMORPHEUS_REPO=https://github.com/PyCQA/isort.git
LLMORPHEUS_VERSION=7.0.0
LLMORPHEUS_PROJECT=isort

LLMORPHEUS_SRC=isort
# _vendored/ is bundled third-party code. deprecated/ holds the old finders,
# whose dedicated test module isort's own tox.ini skips.
LLMORPHEUS_EXCLUDE=isort/_vendored/**,isort/deprecated/**

# Mirrors isort's tox.ini: pytest tests/unit/ --ignore=tests/unit/test_deprecated_finders.py
# -x stops at the first failure; one failure is all a killed mutant needs.
#
# Several tests shell out to the `isort` console script after chdir-ing into a
# temporary directory, so the virtualenv's bin/ must be on PATH as an absolute
# path - tox gets this from the activated env. `$PATH` puts the command in shell
# mode; {project} expands to the (quoted) project directory.
LLMORPHEUS_TEST_COMMAND=PATH={project}/.venv/bin:$PATH {project}/.venv/bin/python -m pytest tests/unit -x -q --ignore=tests/unit/test_deprecated_finders.py

# Six unit-test modules use Hypothesis. With CI set, Hypothesis loads its built-in
# "ci" profile: derandomized, no example database, no deadline. Without it the
# same mutant can be killed on one run and survive the next.
LLMORPHEUS_TEST_ENV=CI=1

# Several unit tests spawn the `isort` script, which the editable install points
# at this clone - not at a --jobs worker's copy. Keep 1 worker: with more, those
# subprocesses could run unmutated code and report false survivors.
LLMORPHEUS_JOBS=1
