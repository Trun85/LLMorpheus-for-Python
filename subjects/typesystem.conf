# typesystem 0.4.1 - https://github.com/encode/typesystem
#
# The final release (2021-11-18). Supports Python 3.6-3.10, so it runs with this
# machine's Python 3.9. Verified: all 1121 tests pass, in about one second.
# Setup: subjects/README.md.
#
# Its setup.cfg turns every warning into an error (filterwarnings = error), and
# pytest 8.4 surfaces the suite's unclosed JSON files as warnings - so with the
# newest pytest the unmodified suite errors out before a single mutant runs.
# The setup pins pytest 8.3.5 instead of weakening the project's warning policy.

LLMORPHEUS_REPO=https://github.com/encode/typesystem.git
LLMORPHEUS_VERSION=0.4.1
LLMORPHEUS_PROJECT=typesystem

LLMORPHEUS_SRC=typesystem
LLMORPHEUS_TEST_COMMAND=.venv/bin/python -m pytest tests -x -q
