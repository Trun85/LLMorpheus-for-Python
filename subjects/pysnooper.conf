# PySnooper - https://github.com/cool-RR/PySnooper
#
# Taken from the BugsInPy++ benchmark (https://github.com/UNIST-LOFT/BugsInPyPP),
# projects/PySnooper bug 2: the pinned commit is that bug's fixed version, so the
# suite is green and the real fix is the last thing that landed. Setup: subjects/README.md.
# Verified on this machine with the system Python 3.9.6: 33 passed in ~0.13 s.
#
# Why this commit and not bug 1 or 3: BugsInPy's bug numbers are not chronological.
# Bug 3's fixed commit (15555ed, 2019-04-22) is the oldest - 5 tests, and
# test_variables fails on Python 3.9 because line tracing changed since 2019.
# Bug 1's (56f22f8, 2019-05-20) passes with 29 tests. This one is the newest and
# the largest suite.
#
# The whole package is 725 lines and the suite runs in about a tenth of a second,
# so a full run over every mutant costs seconds - the cheapest subject here by far.

LLMORPHEUS_REPO=https://github.com/cool-RR/PySnooper.git
LLMORPHEUS_VERSION=814abc34a098c1b98cb327105ac396f985d2413e
LLMORPHEUS_PROJECT=pysnooper

LLMORPHEUS_SRC=pysnooper

# PySnooper's own test command. -x stops at the first failure; one failure is all
# a killed mutant needs.
LLMORPHEUS_TEST_COMMAND=.venv/bin/python -m pytest tests -x -q
