# mlxtend 0.25.0 - https://github.com/rasbt/mlxtend
#
# Needs Python >= 3.11 (mlxtend 0.25.0's package metadata). Setup: subjects/README.md.
# Not yet verified end to end on this machine, which has no Python >= 3.11.
#
# The suite fits scikit-learn models throughout, so expect a far slower baseline
# than isort or typesystem. Time it before starting a large run.

LLMORPHEUS_REPO=https://github.com/rasbt/mlxtend.git
LLMORPHEUS_VERSION=v0.25.0
LLMORPHEUS_PROJECT=mlxtend

LLMORPHEUS_SRC=mlxtend
# externals/ is bundled third-party code. plotting/ is listed in mlxtend's own
# pytest norecursedirs, so its tests never run - not in mlxtend's CI either.
# Every mutant there would survive: tokens spent, score deflated, nothing learnt.
LLMORPHEUS_EXCLUDE=mlxtend/externals/**,mlxtend/plotting/**

# mlxtend's CI command, minus coverage. Tests live inside the package
# (mlxtend/<module>/tests/); llmorpheus never mutates files under tests/.
LLMORPHEUS_TEST_COMMAND=.venv/bin/python -m pytest mlxtend -x -q

# Some tests import matplotlib; never try to open a window during unattended runs.
LLMORPHEUS_TEST_ENV=MPLBACKEND=Agg
